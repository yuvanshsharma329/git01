<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Know Your Future</title>
  <style>
    :root{--bg:#0f172a;--card:#0b1220;--accent:#f59e0b;--glass:rgba(255,255,255,0.06)}
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;padding:40px;margin:0;background:linear-gradient(180deg,#071029 0%, #08122a 100%);color:#e6eef8;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .container{width:100%;max-width:800px;text-align:center}
    .card{background:var(--card);padding:36px;border-radius:16px;box-shadow:0 8px 30px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03)}
    h1{margin:0 0 8px;font-size:28px}
    p.lead{margin:0 0 24px;color:#bcd3f0}
    .btn{display:inline-block;padding:14px 22px;border-radius:12px;background:var(--accent);color:#071022;font-weight:700;border:none;cursor:pointer;font-size:16px;box-shadow:0 6px 18px rgba(245,158,11,0.18)}
    .btn:active{transform:translateY(1px)}

    /* Modal */
    .modal-backdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(0deg, rgba(2,6,23,0.6), rgba(2,6,23,0.6));backdrop-filter:blur(4px);z-index:50}
    .modal{background:var(--glass);border-radius:14px;padding:20px;max-width:520px;width:92%;text-align:center;border:1px solid rgba(255,255,255,0.06)}
    .modal h2{margin:0 0 12px;font-size:22px}
    .modal p{margin:0 0 14px;font-size:18px}
    .maulana-photo{max-width:180px;border-radius:12px;border:3px solid rgba(255,255,255,0.06);display:block;margin:10px auto}
    .close{background:transparent;border:1px solid rgba(255,255,255,0.06);color:inherit;padding:8px 12px;border-radius:10px;cursor:pointer}

    @media (min-width:768px){h1{font-size:34px}}
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Want to know your future?</h1>
      <p class="lead">Click the button below and see what the stars (or someone else) say ✨</p>
      <button class="btn" id="knowBtn">Know your future</button>
    </div>
  </div>

  <script>
    const knowBtn = document.getElementById('knowBtn');
    const backdrop = document.getElementById('backdrop');
    const closeBtn = document.getElementById('closeBtn');

    function openModal(){
      backdrop.style.display = 'flex';
      backdrop.setAttribute('aria-hidden','false');
      // Optionally you can change the text to something dynamic here
      // document.getElementById('modalText').textContent = '26 mei to duniya khatam hai';
    }
    function closeModal(){
      backdrop.style.display = 'none';
      backdrop.setAttribute('aria-hidden','true');
    }

    knowBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeModal(); });

    // keyboard accessibility
    document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeModal(); });
  </script>
