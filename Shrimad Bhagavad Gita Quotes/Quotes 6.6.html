<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bhagavad Gita Quote</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Georgia", serif;
      background: linear-gradient(135deg, #f6d365, #fda085);
    }

    .card {
      max-width: 700px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .content {
      padding: 30px 24px;
    }

    .quote {
      font-size: 1.4rem;
      line-height: 1.6;
      color: #333;
      margin: 0;
    }

    .source {
      margin-top: 16px;
      font-size: 1rem;
      color: #777;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="card">
    <img
      src="https://media.assettype.com/sanmarg%2Fimport%2Fwp-content%2Fuploads%2F2023%2F07%2Farjun-shree-krishna.jpg?w=480&auto=format%2Ccompress&fit=max"
      alt="Lord Krishna and Arjuna"
    >
    <div class="content">
      <p class="quote">
        “For one who has conquered the mind, the mind is the best friend.”
      </p>
      <div class="source">— Bhagavad Gita</div>
    </div>
  </div>
</body>
</html>
